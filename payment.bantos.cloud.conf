server {
    listen 80;
    listen [::]:80;
    server_name payment.bantos.cloud;

    root /var/www/bantos.cloud/bantos-datacenter/payment-webview/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
        
        # Anti-cache rules
        add_header Last-Modified $date_gmt;
        add_header Cache-Control 'no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0';
        if_modified_since off;
        expires off;
        etag off;
    }
}
